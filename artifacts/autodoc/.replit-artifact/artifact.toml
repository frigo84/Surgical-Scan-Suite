kind = "web"
previewPath = "/"
title = "AutoDoc"
version = "1.0.0"
id = "artifacts/autodoc"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18700

[services.development]
run = "pnpm --filter @workspace/autodoc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/autodoc", "run", "build" ]
run = "pnpm --filter @workspace/autodoc run start"

[services.env]
PORT = "18700"
